[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cb1-dynamics"
version = "0.2.0"
description = "Predicting human CB1 receptor activation commitment via Stopped Dynamical Galerkin Approximation, Transition Path Theory, Mori-Zwanzig memory tests, multi-GPCR universality, and single-Hamiltonian OpenMM committor shooting."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=14.0",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "mdtraj>=1.9.9",
    "networkx>=3.2",
    "openmm>=8.1",
    "nbformat>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "jupyter>=1.0",
    "nbconvert>=7.14",
    "ipykernel>=6.29",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
